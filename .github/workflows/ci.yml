name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Unitarias, build y Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_APPS_SCRIPT_URL: https://script.google.com/macros/s/mock/exec
      PRODUCT_CATALOG_FILE: tests/fixtures/product-pages.json
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN: '11111111111111111111111111111111'
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Secretos en los commits nuevos
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          curl --fail --location --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' /tmp/gitleaks.tar.gz | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact=100 --log-opts="$BASE_SHA..HEAD" .
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/cart.spec.mjs tests/e2e/visit-share.spec.mjs tests/e2e/public-analytics.spec.mjs tests/e2e/security.spec.mjs --config=playwright.ci.config.mjs
